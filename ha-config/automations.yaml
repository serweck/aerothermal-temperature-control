# =====================================================================
#  Aerotermia - Automatizaciones (la logica vive en el servidor)
#  Pegar en automations.yaml o crear via UI (modo YAML).
# =====================================================================

# ---------------------------------------------------------------------
# A) Conmutacion de modo + sincronia con el LG + exclusion del rele.
#    Solo UNO de los dos termostatos controla la bomba en cada momento.
# ---------------------------------------------------------------------
- id: aerotermia_conmutacion_modo
  alias: "Aerotermia - Conmutacion de modo (suelo + LG)"
  mode: queued
  trigger:
    - platform: state
      entity_id: input_select.aerotermia_modo
    - platform: homeassistant
      event: start          # re-sincroniza modo (suelo + LG) tras reiniciar HA
  action:
    - choose:
        # ---- CALOR ----
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: calor
          sequence:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_frio }
              data: { hvac_mode: "off" }
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_calor }
              data: { hvac_mode: heat }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: heat
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: heat }
        # ---- FRIO ----
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: frio
          sequence:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_calor }
              data: { hvac_mode: "off" }
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_frio }
              data: { hvac_mode: cool }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: cool
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: cool }
        # ---- AUTO ----
        # El LG decide calor o frio. Ningun termostato manda (se pelearian por
        # el rele compartido) y del rele se encarga la automatizacion D, con
        # sus cortes de seguridad.
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: auto
          sequence:
            - service: climate.set_hvac_mode
              target:
                entity_id:
                  - climate.suelo_radiante_calor
                  - climate.suelo_radiante_frio
              data: { hvac_mode: "off" }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: auto
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: auto }
      # ---- OFF (default) ----
      default:
        - service: climate.set_hvac_mode
          target:
            entity_id:
              - climate.suelo_radiante_calor
              - climate.suelo_radiante_frio
          data: { hvac_mode: "off" }
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.bomba_de_calor_aire_agua_2
                  state: "off"
          then:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
              data: { hvac_mode: "off" }
        - service: switch.turn_off
          target: { entity_id: switch.socket_garaje_aerotermia_bomba }

# ---------------------------------------------------------------------
# B) Seguridad: si el motor LG se apaga o falla, apaga la bomba y los
#    termostatos. No tiene sentido mover agua sin generacion.
# ---------------------------------------------------------------------
- id: aerotermia_seguridad_motor
  alias: "Aerotermia - Seguridad: motor apagado apaga bomba"
  mode: single
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      to:
        - "off"
        - "unavailable"
      for: { seconds: 30 }
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.suelo_radiante_calor
          - climate.suelo_radiante_frio
      data: { hvac_mode: "off" }
    - service: switch.turn_off
      target: { entity_id: switch.socket_garaje_aerotermia_bomba }
    - service: input_select.select_option
      target: { entity_id: input_select.aerotermia_modo }
      data: { option: "off" }

# ---------------------------------------------------------------------
# C) Sincronia inversa: si el LG cambia de modo desde su propio panel,
#    la tarjeta lo refleja. El modo auto tiene su propia opcion en el
#    input_select, asi que salir de auto es un cambio de estado real y
#    la automatizacion A puede apagar el rele por su camino normal.
#
#    El "to:" es explicito a proposito: deja fuera unavailable y unknown,
#    para que un corte de la nube de LG no vacie la tarjeta. De eso ya se
#    ocupa la automatizacion B a los 30 s.
# ---------------------------------------------------------------------
- id: aerotermia_sincronia_lg
  alias: "Aerotermia - Sincronia: el LG manda"
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      to: ["heat", "cool", "auto", "off"]
  condition:
    # Solo hacemos caso a los cambios que NO ha originado Home Assistant.
    #
    # lg_thinq es una integracion en la nube con ~2 s de latencia, asi que las
    # ordenes que A le manda al LG vuelven como cambios de estado tardios. Sin
    # esta condicion, esos ecos se tomaban por decisiones de la maquina, se
    # reescribian en el input_select pisando lo que el usuario acababa de
    # elegir, y disparaban A otra vez: oscilacion sostenida cada ~1 s.
    #
    # Firma del origen del cambio:
    #   maquina o panel -> parent_id null,   user_id null    -> SI actuamos
    #   usuario en HA   -> parent_id null,   user_id puesto  -> SI actuamos
    #   eco de A        -> parent_id PUESTO                  -> lo ignoramos
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id is none }}"
  action:
    - service: input_select.select_option
      target: { entity_id: input_select.aerotermia_modo }
      data:
        option: >
          {% set m = states('climate.bomba_de_calor_aire_agua_2') %}
          {{ 'calor' if m == 'heat' else 'frio' if m == 'cool'
             else 'auto' if m == 'auto' else 'off' }}

# ---------------------------------------------------------------------
# D) Dueña del estado auto: en auto no manda ningun termostato (se
#    pelearian por el rele compartido) y el suelo circula de forma
#    continua, con tres cortes de seguridad.
#
#    El sentido (calor o frio) se deduce comparando la impulsion con la
#    temperatura de la casa, porque el LG no expone hvac_action.
# ---------------------------------------------------------------------
- id: aerotermia_auto_circulacion
  alias: "Aerotermia - Auto: circulacion del suelo con corte de seguridad"
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
    - platform: state
      entity_id:
        - sensor.bomba_de_calor_aire_agua_temperatura_de_salida
        - sensor.temperatura_termostato
        - sensor.punto_de_rocio_interior
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      state: auto
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.suelo_radiante_calor
          - climate.suelo_radiante_frio
      data: { hvac_mode: "off" }
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set salida = states('sensor.bomba_de_calor_aire_agua_temperatura_de_salida') | float(-999) %}
                {% set rocio = states('sensor.punto_de_rocio_interior') | float(999) %}
                {% set zona = states('sensor.temperatura_termostato') | float(-999) %}
                {% set calentando = salida > zona + 2 %}
                {% set enfriando = salida < zona - 2 %}
                {{ salida < rocio + 2
                   or salida > 45
                   or (calentando and zona > 26)
                   or (enfriando and zona < 21) }}
          sequence:
            - service: switch.turn_off
              target: { entity_id: switch.socket_garaje_aerotermia_bomba }
      default:
        - service: switch.turn_on
          target: { entity_id: switch.socket_garaje_aerotermia_bomba }

# ---------------------------------------------------------------------
# E) Modos automaticos en calor (creada el 2026-10-17, DESACTIVADA hasta
#    que se active a mano). Sustituye a las pestañas Termostato y Alarma
#    de Node-RED, que se borraron ese dia.
#
#    Solo cambia el PRESET del termostato de calor; la temperatura de
#    cada preset vive en el termostato y la tarjeta la guarda ahi (v1.6.0).
#    comfort desde el arranque calculado para tener la casa lista a la
#    hora de confort, eco desde la hora de eco. En frio, auto y off no
#    hace nada, y tampoco con el candado (input_boolean.bloquear_termostato).
#    La alarma no influye. Con el modo vacaciones tampoco actua (lo lleva H);
#    al terminar, aplica el preset que toque por horario.
# ---------------------------------------------------------------------
- id: aerotermia_modos_automaticos_calor
  alias: "Aerotermia - Modos automáticos (calor)"
  mode: queued
  triggers:
    - trigger: state
      entity_id: binary_sensor.aerotermia_arranque_confort
      to: "on"
      id: confort
    - trigger: time
      at: input_datetime.aerotermia_hora_eco
      id: eco
    - trigger: state
      entity_id: input_select.aerotermia_modo
      to: calor
      id: modo
    # fin de las vacaciones: como un cambio de modo, aplica el horario
    - trigger: state
      entity_id: input_boolean.modo_vacaciones
      from: "on"
      to: "off"
      id: modo
  conditions:
    - condition: state
      entity_id: input_boolean.bloquear_termostato
      state: "off"
    - condition: state
      entity_id: input_select.aerotermia_modo
      state: calor
    - condition: state
      entity_id: input_boolean.modo_vacaciones
      state: "off"
  actions:
    - choose:
        - alias: Toca confort
          conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: confort
                # al pasar a calor: comfort si ya ha arrancado o es de dia
                - condition: and
                  conditions:
                    - condition: trigger
                      id: modo
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: binary_sensor.aerotermia_arranque_confort
                          state: "on"
                        - condition: time
                          after: input_datetime.aerotermia_hora_confort
                          before: input_datetime.aerotermia_hora_eco
          sequence:
            - action: climate.set_preset_mode
              target: { entity_id: climate.suelo_radiante_calor }
              data: { preset_mode: comfort }
      default:
        - action: climate.set_preset_mode
          target: { entity_id: climate.suelo_radiante_calor }
          data: { preset_mode: eco }

# ---------------------------------------------------------------------
# F) Aprende el ritmo de calentamiento (DESACTIVADA, se activa con E).
#    Mide cada subida de eco a comfort en calor: desde que se pasa a
#    comfort hasta superar la temperatura de confort. Nuevo ritmo =
#    70 % el anterior + 30 % lo medido, entre 0,1 y 3 °C/h. Solo cuenta
#    subidas de al menos 0,5 °C y 15 min.
# ---------------------------------------------------------------------
- id: aerotermia_aprender_ritmo_calentamiento
  alias: "Aerotermia - Aprender ritmo de calentamiento"
  mode: queued
  triggers:
    - trigger: state
      entity_id: climate.suelo_radiante_calor
      attribute: preset_mode
      from: eco
      to: comfort
      id: inicio
    - trigger: numeric_state
      entity_id: sensor.temperatura_termostato
      above: input_number.aerotermia_temperatura_confort
      id: llegada
    - trigger: state
      entity_id: climate.suelo_radiante_calor
      attribute: preset_mode
      from: comfort
      id: cancelar
    - trigger: state
      entity_id: input_select.aerotermia_modo
      from: calor
      id: cancelar
  actions:
    - choose:
        - alias: Empieza una subida
          conditions:
            - condition: trigger
              id: inicio
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: calor
            - condition: template
              value_template: >-
                {{ states('sensor.temperatura_termostato') | float(99)
                   < states('input_number.aerotermia_temperatura_confort') | float(0) - 0.5 }}
          sequence:
            - action: input_datetime.set_datetime
              target: { entity_id: input_datetime.aerotermia_subida_inicio }
              data: { timestamp: "{{ now().timestamp() }}" }
            - action: input_number.set_value
              target: { entity_id: input_number.aerotermia_subida_temperatura_inicio }
              data: { value: "{{ states('sensor.temperatura_termostato') | float }}" }
            - action: input_boolean.turn_on
              target: { entity_id: input_boolean.aerotermia_subida_midiendo }
        - alias: Llega al confort
          conditions:
            - condition: trigger
              id: llegada
            - condition: state
              entity_id: input_boolean.aerotermia_subida_midiendo
              state: "on"
          sequence:
            - variables:
                horas: >-
                  {{ (now().timestamp() - state_attr('input_datetime.aerotermia_subida_inicio', 'timestamp') | float(0)) / 3600 }}
                subida: >-
                  {{ states('sensor.temperatura_termostato') | float(0)
                     - states('input_number.aerotermia_subida_temperatura_inicio') | float(0) }}
            - if:
                - condition: template
                  value_template: "{{ horas >= 0.25 and subida >= 0.5 }}"
              then:
                - action: input_number.set_value
                  target: { entity_id: input_number.aerotermia_ritmo_calentamiento }
                  data:
                    value: >-
                      {{ [0.1, [0.7 * states('input_number.aerotermia_ritmo_calentamiento') | float(0.5)
                                + 0.3 * subida / horas, 3] | min] | max | round(2) }}
            - action: input_boolean.turn_off
              target: { entity_id: input_boolean.aerotermia_subida_midiendo }
        - alias: Se corta la subida
          conditions:
            - condition: trigger
              id: cancelar
          sequence:
            - action: input_boolean.turn_off
              target: { entity_id: input_boolean.aerotermia_subida_midiendo }

# ---------------------------------------------------------------------
# G) Recuerda la temperatura de confort (ACTIVA: no toca el termostato).
#    Una plantilla no puede leer la temperatura configurada de un preset,
#    asi que se copia al input_number cada vez que el termostato de calor
#    esta en comfort. La usa binary_sensor.aerotermia_arranque_confort.
# ---------------------------------------------------------------------
- id: aerotermia_recordar_temperatura_confort
  alias: "Aerotermia - Recordar temperatura de confort"
  mode: queued
  triggers:
    - trigger: state
      entity_id: climate.suelo_radiante_calor
      attribute: temperature
    - trigger: state
      entity_id: climate.suelo_radiante_calor
      attribute: preset_mode
      to: comfort
  conditions:
    - condition: state
      entity_id: climate.suelo_radiante_calor
      attribute: preset_mode
      state: comfort
  actions:
    - action: input_number.set_value
      target: { entity_id: input_number.aerotermia_temperatura_confort }
      data: { value: "{{ state_attr('climate.suelo_radiante_calor', 'temperature') }}" }

# ---------------------------------------------------------------------
# H) Vacaciones (creada el 2026-10-17, DESACTIVADA; va con E y F en el
#    interruptor de la tarjeta). Usa el modo vacaciones del proyecto
#    «Modo vacaciones» (input_boolean.modo_vacaciones y su vuelta
#    programada opcional).
#
#    Con el modo, el termostato del modo activo pasa a away (calor 15 °C,
#    frio 28 °C). Con vuelta programada vuelve a comfort con antelacion:
#    binary_sensor.aerotermia_vuelta_vacaciones. Al terminar, en frio vuelve
#    a comfort; en calor lo retoma E. Auto y off no se tocan, ni nada con
#    el candado puesto. Solo cambia presets.
# ---------------------------------------------------------------------
- id: aerotermia_vacaciones
  alias: "Aerotermia - Vacaciones"
  mode: queued
  triggers:
    - trigger: state
      entity_id: input_boolean.modo_vacaciones
      to: "on"
      id: inicio
    - trigger: state
      entity_id: binary_sensor.aerotermia_vuelta_vacaciones
      to: "on"
      id: vuelta
    - trigger: state
      entity_id: input_select.aerotermia_modo
      to: [calor, frio]
      id: modo
    - trigger: state
      entity_id: input_boolean.modo_vacaciones
      from: "on"
      to: "off"
      id: fin
  conditions:
    - condition: state
      entity_id: input_boolean.bloquear_termostato
      state: "off"
    - condition: state
      entity_id: input_select.aerotermia_modo
      state: [calor, frio]
  actions:
    - variables:
        termostato: >-
          {{ 'climate.suelo_radiante_frio' if is_state('input_select.aerotermia_modo', 'frio')
             else 'climate.suelo_radiante_calor' }}
    - choose:
        - alias: "Fin de las vacaciones en frío: comfort"
          conditions:
            - condition: trigger
              id: fin
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: frio
          sequence:
            - action: climate.set_preset_mode
              target: { entity_id: "{{ termostato }}" }
              data: { preset_mode: comfort }
        - alias: "Toca preparar la vuelta: comfort"
          conditions:
            - condition: trigger
              id: [inicio, vuelta, modo]
            - condition: state
              entity_id: input_boolean.modo_vacaciones
              state: "on"
            - condition: state
              entity_id: binary_sensor.aerotermia_vuelta_vacaciones
              state: "on"
          sequence:
            - action: climate.set_preset_mode
              target: { entity_id: "{{ termostato }}" }
              data: { preset_mode: comfort }
        - alias: "De vacaciones: away"
          conditions:
            - condition: trigger
              id: [inicio, modo]
            - condition: state
              entity_id: input_boolean.modo_vacaciones
              state: "on"
          sequence:
            - action: climate.set_preset_mode
              target: { entity_id: "{{ termostato }}" }
              data: { preset_mode: away }

# ---------------------------------------------------------------------
# I) Objetivo del agua por modo. El LG tiene un solo objetivo de agua y
#    no lo recuerda por modo: al pasar de calor (30 °C) a frio se queda
#    en lo que le parece. Cada modo guarda el suyo en un input_number y,
#    al volver a ese modo, se le devuelve al LG.
#
#    Guardar: cambios del objetivo con el LG en calor o frio, estables
#    5 s. Se ignoran dos: el que llega en la misma actualizacion que el
#    cambio de modo (es el valor que pone el LG, no el usuario) y el eco
#    de la propia recuperacion (lleva parent_id, como en C). Lo que se
#    ajuste justo despues de cambiar de modo SI se guarda.
#    Recuperar: 10 s despues de entrar en calor o frio (para que el LG ya
#    haya publicado los limites del modo nuevo), recortado a min/max, y
#    solo si en esos 10 s nadie ha tocado el objetivo.
#    Auto no se toca: ahi el LG decide el sentido.
# ---------------------------------------------------------------------
- id: aerotermia_objetivo_agua_por_modo
  alias: "Aerotermia - Objetivo del agua por modo (calor / frio)"
  mode: queued
  triggers:
    - trigger: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      attribute: temperature
      for: { seconds: 5 }
      id: guardar
    - trigger: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      to: [heat, cool]
      for: { seconds: 10 }
      id: recuperar
  conditions:
    - condition: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      state: [heat, cool]
  actions:
    - variables:
        lg: climate.bomba_de_calor_aire_agua_2
        ayudante: >-
          {{ 'input_number.aerotermia_objetivo_agua_calor' if is_state(lg, 'heat')
             else 'input_number.aerotermia_objetivo_agua_frio' }}
        actual: "{{ state_attr(lg, 'temperature') }}"
    - choose:
        - alias: "Entra en calor o frio: recupera el objetivo de ese modo"
          conditions:
            - condition: trigger
              id: recuperar
          sequence:
            - variables:
                objetivo: >-
                  {{ [[states(ayudante) | float(0), state_attr(lg, 'min_temp') | float(0)] | max,
                      state_attr(lg, 'max_temp') | float(99)] | min }}
            - if:
                - condition: template
                  value_template: >-
                    {{ actual == trigger.to_state.attributes.temperature
                       and actual | float(-1) != objetivo }}
              then:
                - action: climate.set_temperature
                  target: { entity_id: "{{ lg }}" }
                  data: { temperature: "{{ objetivo }}" }
        - alias: "Cambia el objetivo: lo guarda en el modo actual"
          conditions:
            - condition: trigger
              id: guardar
            - condition: template
              value_template: >-
                {{ trigger.to_state.state == states(lg)
                   and trigger.from_state.state == trigger.to_state.state
                   and trigger.to_state.context.parent_id is none
                   and actual is number }}
          sequence:
            - action: input_number.set_value
              target: { entity_id: "{{ ayudante }}" }
              data: { value: "{{ actual }}" }
