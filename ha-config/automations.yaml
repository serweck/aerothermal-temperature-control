# =====================================================================
#  Aerotermia - Automatizaciones (la logica vive en el servidor)
#  Pegar en automations.yaml o crear via UI (modo YAML).
# =====================================================================

# ---------------------------------------------------------------------
# A) Conmutacion de modo + sincronia con el LG + exclusion del rele.
#    Solo UNO de los dos termostatos controla la bomba en cada momento.
# ---------------------------------------------------------------------
- id: aerotermia_conmutacion_modo
  alias: "Aerotermia - Conmutacion de modo (suelo + LG)"
  mode: queued
  trigger:
    - platform: state
      entity_id: input_select.aerotermia_modo
    - platform: homeassistant
      event: start          # re-sincroniza modo (suelo + LG) tras reiniciar HA
  action:
    - choose:
        # ---- CALOR ----
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: calor
          sequence:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_frio }
              data: { hvac_mode: "off" }
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_calor }
              data: { hvac_mode: heat }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: heat
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: heat }
        # ---- FRIO ----
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: frio
          sequence:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_calor }
              data: { hvac_mode: "off" }
            - service: climate.set_hvac_mode
              target: { entity_id: climate.suelo_radiante_frio }
              data: { hvac_mode: cool }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: cool
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: cool }
        # ---- AUTO ----
        # El LG decide calor o frio. Ningun termostato manda (se pelearian por
        # el rele compartido) y del rele se encarga la automatizacion D, con
        # sus cortes de seguridad.
        - conditions:
            - condition: state
              entity_id: input_select.aerotermia_modo
              state: auto
          sequence:
            - service: climate.set_hvac_mode
              target:
                entity_id:
                  - climate.suelo_radiante_calor
                  - climate.suelo_radiante_frio
              data: { hvac_mode: "off" }
            # Solo se le manda el modo al LG si NO lo tiene ya. Reenviarle un
            # modo que ya tiene NO es inofensivo: la integracion de la nube
            # publica un estado intermedio espurio mientras la orden viaja, y si
            # no viene nada detras a corregirlo, ese estado falso se queda.
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.bomba_de_calor_aire_agua_2
                      state: auto
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
                  data: { hvac_mode: auto }
      # ---- OFF (default) ----
      default:
        - service: climate.set_hvac_mode
          target:
            entity_id:
              - climate.suelo_radiante_calor
              - climate.suelo_radiante_frio
          data: { hvac_mode: "off" }
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.bomba_de_calor_aire_agua_2
                  state: "off"
          then:
            - service: climate.set_hvac_mode
              target: { entity_id: climate.bomba_de_calor_aire_agua_2 }
              data: { hvac_mode: "off" }
        - service: switch.turn_off
          target: { entity_id: switch.socket_garaje_aerotermia_bomba }

# ---------------------------------------------------------------------
# B) Seguridad: si el motor LG se apaga o falla, apaga la bomba y los
#    termostatos. No tiene sentido mover agua sin generacion.
# ---------------------------------------------------------------------
- id: aerotermia_seguridad_motor
  alias: "Aerotermia - Seguridad: motor apagado apaga bomba"
  mode: single
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      to:
        - "off"
        - "unavailable"
      for: { seconds: 30 }
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.suelo_radiante_calor
          - climate.suelo_radiante_frio
      data: { hvac_mode: "off" }
    - service: switch.turn_off
      target: { entity_id: switch.socket_garaje_aerotermia_bomba }
    - service: input_select.select_option
      target: { entity_id: input_select.aerotermia_modo }
      data: { option: "off" }

# ---------------------------------------------------------------------
# C) Sincronia inversa: si el LG cambia de modo desde su propio panel,
#    la tarjeta lo refleja. El modo auto tiene su propia opcion en el
#    input_select, asi que salir de auto es un cambio de estado real y
#    la automatizacion A puede apagar el rele por su camino normal.
#
#    El "to:" es explicito a proposito: deja fuera unavailable y unknown,
#    para que un corte de la nube de LG no vacie la tarjeta. De eso ya se
#    ocupa la automatizacion B a los 30 s.
# ---------------------------------------------------------------------
- id: aerotermia_sincronia_lg
  alias: "Aerotermia - Sincronia: el LG manda"
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      to: ["heat", "cool", "auto", "off"]
  condition:
    # Solo hacemos caso a los cambios que NO ha originado Home Assistant.
    #
    # lg_thinq es una integracion en la nube con ~2 s de latencia, asi que las
    # ordenes que A le manda al LG vuelven como cambios de estado tardios. Sin
    # esta condicion, esos ecos se tomaban por decisiones de la maquina, se
    # reescribian en el input_select pisando lo que el usuario acababa de
    # elegir, y disparaban A otra vez: oscilacion sostenida cada ~1 s.
    #
    # Firma del origen del cambio:
    #   maquina o panel -> parent_id null,   user_id null    -> SI actuamos
    #   usuario en HA   -> parent_id null,   user_id puesto  -> SI actuamos
    #   eco de A        -> parent_id PUESTO                  -> lo ignoramos
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id is none }}"
  action:
    - service: input_select.select_option
      target: { entity_id: input_select.aerotermia_modo }
      data:
        option: >
          {% set m = states('climate.bomba_de_calor_aire_agua_2') %}
          {{ 'calor' if m == 'heat' else 'frio' if m == 'cool'
             else 'auto' if m == 'auto' else 'off' }}

# ---------------------------------------------------------------------
# D) Dueña del estado auto: en auto no manda ningun termostato (se
#    pelearian por el rele compartido) y el suelo circula de forma
#    continua, con tres cortes de seguridad.
#
#    El sentido (calor o frio) se deduce comparando la impulsion con la
#    temperatura de la casa, porque el LG no expone hvac_action.
# ---------------------------------------------------------------------
- id: aerotermia_auto_circulacion
  alias: "Aerotermia - Auto: circulacion del suelo con corte de seguridad"
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: climate.bomba_de_calor_aire_agua_2
    - platform: state
      entity_id:
        - sensor.bomba_de_calor_aire_agua_temperatura_de_salida
        - sensor.temperatura_termostato
        - sensor.punto_de_rocio_interior
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: climate.bomba_de_calor_aire_agua_2
      state: auto
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.suelo_radiante_calor
          - climate.suelo_radiante_frio
      data: { hvac_mode: "off" }
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set salida = states('sensor.bomba_de_calor_aire_agua_temperatura_de_salida') | float(-999) %}
                {% set rocio = states('sensor.punto_de_rocio_interior') | float(999) %}
                {% set zona = states('sensor.temperatura_termostato') | float(-999) %}
                {% set calentando = salida > zona + 2 %}
                {% set enfriando = salida < zona - 2 %}
                {{ salida < rocio + 2
                   or salida > 45
                   or (calentando and zona > 26)
                   or (enfriando and zona < 21) }}
          sequence:
            - service: switch.turn_off
              target: { entity_id: switch.socket_garaje_aerotermia_bomba }
      default:
        - service: switch.turn_on
          target: { entity_id: switch.socket_garaje_aerotermia_bomba }
