# =====================================================================
#  OJO: los dos generic_thermostat de abajo NO viven en este fichero.
#  En la instalacion real son *helpers de UI* (config entries
#  01KXAJ6GXFXPA3M906940M5H62 y 01KXAJ8CQQTF42H568DV4M7B4N). Lo de abajo
#  copia su configuracion real, comprobada el 2026-10-17.
#
#  La temperatura de cada preset se cambia desde la tarjeta (ajustando con
#  el preset marcado, v1.6.0+) o en Ayudantes > el termostato > Opciones;
#  no hace falta reiniciar. Los presets home y sleep ya no existen.
# =====================================================================

# =====================================================================
#  Aerotermia - Backend Home Assistant
#  Pega estos bloques en tu configuration.yaml (o usa packages).
#  Entidades reales:
#    - rele bomba:  switch.socket_garaje_aerotermia_bomba
#    - sensor zona: sensor.temperatura_termostato
#    - motor LG:    climate.bomba_de_calor_aire_agua_2
# =====================================================================

climate:
  # ─────────── CALOR (invierno) ───────────
  - platform: generic_thermostat
    name: Suelo Radiante Calor
    unique_id: suelo_radiante_calor
    heater: switch.socket_garaje_aerotermia_bomba
    target_sensor: sensor.temperatura_termostato
    ac_mode: false            # calienta: bomba ON cuando T < objetivo
    min_temp: 15
    max_temp: 28
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    min_cycle_duration:
      minutes: 10             # protege la bomba de ciclos cortos
    away_temp: 15             # Fuera
    comfort_temp: 22          # Confort
    eco_temp: 20              # Eco (noche, modos automaticos)

  # ─────────── FRIO (verano) ───────────
  - platform: generic_thermostat
    name: Suelo Radiante Frio
    unique_id: suelo_radiante_frio
    heater: switch.socket_garaje_aerotermia_bomba
    target_sensor: sensor.temperatura_termostato
    ac_mode: true             # enfria: bomba ON cuando T > objetivo
    min_temp: 20
    max_temp: 30
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    min_cycle_duration:
      minutes: 10
    away_temp: 28             # Fuera
    comfort_temp: 23          # Confort
    eco_temp: 25              # Eco

input_select:
  aerotermia_modo:
    name: Modo Aerotermia (suelo)
    icon: mdi:hvac
    options:
      - "off"
      - calor
      - frio
      - auto          # el LG decide; el suelo circula (automatizacion D)

# =====================================================================
#  Punto de rocio interior — corte de seguridad de la circulacion en auto
#
#  OJO: en la instalacion real esto NO vive aqui, sino como *helper de
#  plantilla* creado por la UI (Ajustes > Ayudantes > Plantilla > Sensor),
#  creado el 2026-09-11. Se documenta aqui para que el repo describa el
#  sistema completo. Si algun dia se pasa a YAML, borrar antes el helper
#  para no acabar con dos entidades.
#
#  Punto de rocio POR ESTANCIA (formula de Magnus), quedandose con el
#  MAXIMO: manda la habitacion peor. Trece estancias interiores; quedan
#  fuera las exteriores, el balcon, el garaje y el sotano, que no son
#  zonas de suelo radiante.
# =====================================================================

template:
  - sensor:
      - name: "Punto de rocio interior"
        unique_id: punto_de_rocio_interior
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set rooms = [
            '05_entrada','06_cocina','07_bano_planta_baja','08_comedor','09_salon',
            '10_despacho','11_habitacion_izquierda','12_habitacion_derecha',
            '13_habitacion_centro','14_pasillo','15_bano_invitados',
            '16_bano_principal','17_habitacion_principal'
          ] %}
          {% set ns = namespace(td = -999.0) %}
          {% for r in rooms %}
            {% set t = states('sensor.temperature_sensor_' ~ r ~ '_temperature') | float(-999) %}
            {% set h = states('sensor.temperature_sensor_' ~ r ~ '_humidity') | float(-999) %}
            {% if t > -900 and h > 0 %}
              {% set g = log(h / 100) + (17.27 * t) / (237.7 + t) %}
              {% set d = (237.7 * g) / (17.27 - g) %}
              {% if d > ns.td %}{% set ns.td = d %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.td | round(1) if ns.td > -900 else none }}

# =====================================================================
#  Modos automaticos en calor (automatizaciones E, F y G)
#
#  OJO: en la instalacion real todo esto son *helpers creados por la UI*
#  el 2026-10-17 (Ajustes > Ayudantes). Se documenta aqui para que el
#  repo describa el sistema completo; si se pasa a YAML, borrar antes
#  los helpers para no duplicar entidades.
#
#  - input_datetime.aerotermia_hora_confort   08:30  casa lista en confort
#  - input_datetime.aerotermia_hora_eco       23:00  empieza a bajar
#  - input_number.aerotermia_ritmo_calentamiento     0,5 °C/h al empezar (aprende F)
#  - input_number.aerotermia_temperatura_confort     copia del preset comfort (G)
#  - input_boolean.aerotermia_subida_midiendo        estado de la medicion (F)
#  - input_datetime.aerotermia_subida_inicio         (fecha y hora)
#  - input_number.aerotermia_subida_temperatura_inicio
#  - input_boolean.bloquear_termostato               candado de la tarjeta
#
#  Ese dia tambien se cambio eco_temp del termostato de calor a 20 °C
#  (comfort 22, away 15). Los termostatos reales son helpers de UI.
#  (Va dentro del mismo bloque template: de arriba.)
# =====================================================================

  - binary_sensor:
      - name: "Aerotermia arranque confort"
        # Hora de confort menos lo que tarda en subir de la temperatura
        # actual a la de confort con el ritmo aprendido (max. 8 h); en on
        # hasta la hora de eco. Mientras sube puede apagarse y encenderse:
        # E solo reacciona al encendido.
        state: >
          {% set t = states('sensor.temperatura_termostato') | float(none) %}
          {% set objetivo = states('input_number.aerotermia_temperatura_confort') | float(22) %}
          {% set ritmo = states('input_number.aerotermia_ritmo_calentamiento') | float(0.5) %}
          {% set horas = 0 if t is none or ritmo <= 0 else [0, [(objetivo - t) / ritmo, 8] | min] | max %}
          {{ today_at(states('input_datetime.aerotermia_hora_confort')) - timedelta(hours=horas)
             <= now() < today_at(states('input_datetime.aerotermia_hora_eco')) }}
